<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academy</title>
<style>
:root{color-scheme:light dark;
  --paper:#F5F4FB;--surface:#FFFFFF;--ink:#1E1B3A;--muted:#625F7D;--line:#E2E0F0;
  --accent:#4338CA;--accent-ink:#FFFFFF;--soft:#E8E6FB;
  --pdf:#C62828;--video:#1565C0;--yt:#D32F2F;--img:#2E7D32;--doc:#00838F;--file:#5D6B7A;--folder:#F2A900;--danger:#B3261E;--ok:#1F7A4D}
@media (prefers-color-scheme:dark){:root{
  --paper:#12111C;--surface:#1C1B2A;--ink:#ECEAF8;--muted:#A3A0BF;--line:#2E2C44;
  --accent:#9C95FF;--accent-ink:#12111C;--soft:#2A2850;
  --pdf:#FF8A80;--video:#82B1FF;--yt:#FF8A80;--img:#A5D6A7;--doc:#80DEEA;--file:#B0BEC5;--folder:#FFCA28;--danger:#FF8A80;--ok:#69D29C}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 120px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;padding:10px 6px 8px;margin:0 -14px;border-bottom:1px solid transparent}
.bar.shadow{border-bottom-color:var(--line);box-shadow:0 6px 12px -10px rgba(0,0,0,.35)}
.bar h1{flex:1;min-width:0;margin:0 6px;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:none;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);padding:0}
.ib:active{background:var(--soft)}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;margin:6px 0 16px}
.hero b{display:block;font-size:22px;line-height:1.2}
.hero span{opacity:.85;font-size:14px}
.sec{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.recent{display:flex;overflow-x:auto;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rc{flex:none;width:150px;margin-right:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.rc .t{display:block;font-weight:700;font-size:14px;line-height:1.3;margin-top:8px;max-height:2.6em;overflow:hidden}
.rc .m{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rc img{width:100%;height:72px;object-fit:cover;border-radius:8px;display:block;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px}
.fc{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:64px;text-align:left;position:relative}
.fc .fi{width:38px;height:38px;flex:none;margin-right:10px;color:var(--folder)}
.fc .fi svg{width:38px;height:38px}
.fc .n{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;border-top:1px solid var(--line)}
.list li:first-child .row{border-top:none}
.row .main{flex:1;min-width:0;display:flex;align-items:center;background:none;border:none;text-align:left;padding:10px 12px;min-height:66px}
.row .main:active{background:var(--soft)}
.tile{width:44px;height:44px;border-radius:12px;flex:none;margin-right:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em}
.tile svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k-html{background:#0E7490}.k-pdf{background:var(--pdf)}.k-video{background:var(--video)}.k-img{background:var(--img)}.k-doc{background:var(--doc)}.k-file{background:var(--file)}
.thumb{width:80px;height:45px;border-radius:8px;flex:none;margin-right:12px;background:var(--line) center/cover no-repeat;position:relative}
.thumb:after{content:"";position:absolute;left:50%;top:50%;margin:-10px 0 0 -14px;width:28px;height:20px;border-radius:6px;background:var(--yt)}
.thumb:before{content:"";position:absolute;left:50%;top:50%;margin:-5px 0 0 -3px;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #fff;z-index:1}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.txt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.txt .new,.new{display:inline-block;width:auto;margin-top:0;color:var(--accent-ink);background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.more{width:44px;height:66px;border:none;background:none;color:var(--muted);font-size:22px;flex:none}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5}
.note{font-size:13.5px;color:var(--muted);margin:10px 2px}
.err{background:var(--surface);border:1px solid var(--danger);color:var(--ink);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.err b{color:var(--danger)}
.skel{height:66px;border-top:1px solid var(--line);background:linear-gradient(90deg,var(--surface),var(--soft),var(--surface));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.fab{position:fixed;right:18px;bottom:22px;width:62px;height:62px;border-radius:20px;border:none;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:6;display:flex;align-items:center;justify-content:center}
.fab svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.search{display:block;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;margin:4px 0 12px}
/* viewer */
#viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:20;display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer .vbar{display:flex;align-items:center;background:#111;color:#fff;padding:6px 4px;min-height:54px}
#viewer .vbar .ib{color:#fff}
#viewer .vbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;margin:0 4px}
#viewer iframe{flex:1;width:100%;border:0;background:#fff}
#viewer .vload{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#ddd;pointer-events:none}
/* sheet */
.sheetbg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,8,30,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px 20px;max-height:90vh;overflow-y:auto}
.sheet h3{margin:2px 4px 12px;font-size:18px}
.opt{display:flex;align-items:center;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;min-height:64px}
.opt .tile{margin-right:12px}
.opt b{display:block}.opt small{display:block;color:var(--muted);font-size:13px}
.sheet label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:0 2px 12px}
.sheet input{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-size:16px;font-weight:400;color:var(--ink)}
.cancel{display:block;width:100%;background:none;border:none;color:var(--muted);font-weight:700;min-height:46px;margin-top:4px}
/* uploads */
#ups{position:fixed;left:10px;right:10px;bottom:96px;z-index:7;max-width:700px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.2);padding:10px 12px;display:none;max-height:40vh;overflow-y:auto}
#ups.open{display:block}
#ups .uh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:4px}
#ups .uh button{border:none;background:none;color:var(--accent);font-weight:700;min-height:36px}
.up{padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.up:first-of-type{border-top:none}
.up .un{display:flex;justify-content:space-between}
.up .un span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
.up .pb{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.up .pb i{display:block;height:100%;background:var(--accent);width:0}
.up.ok .pb i{background:var(--ok)}.up.bad .un span:last-child{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:28px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14.5px;max-width:90%;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.crumbs{font-size:13px;color:var(--muted);margin:-2px 2px 10px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{border:none;background:none;color:var(--accent);font-weight:700;padding:4px 2px;font-size:13px}
.teacherpill{display:inline-block;background:var(--soft);color:var(--accent);font-weight:800;font-size:11px;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.toast{transition:none}}
/* worksheets */
.k-quiz{background:#7C3AED}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;max-width:360px;border:none;background:none;color:var(--muted);font-weight:700;font-size:12.5px;padding:8px 0 10px;min-height:58px;display:flex;flex-direction:column;align-items:center;border-top:3px solid transparent}
#nav button.on{color:var(--accent);border-top-color:var(--accent)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
body.hasnav .fab{bottom:80px}
body.hasnav #ups{bottom:154px}
body.hasnav .toast,body.hasbar .toast{bottom:96px}
.chip{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:800;vertical-align:1px}
.chip.good{background:#DCF5E7;color:#166534}.chip.mid{background:#FEF3C7;color:#92400E}.chip.low{background:#FEE2E2;color:#991B1B}
.hero.ws{background:#7C3AED;color:#fff}
#busyov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(10,8,30,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#busyov .bo{background:var(--surface);border-radius:18px;padding:22px 20px;text-align:center;max-width:320px;width:100%}
#busyov p{margin:12px 0 0;color:var(--ink);font-weight:600}
.edwrap{padding-bottom:90px}
.two{display:flex;gap:10px}.two .fl{flex:1;min-width:0}
label.fl select,label.fl textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 10px;font-size:16px;font-weight:400;color:var(--ink);font-family:inherit}
.info{background:var(--soft);border-radius:14px;padding:12px 14px;margin:12px 0 8px;font-size:14px}
.info.warn{background:#FEF3C7;color:#713F12}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tools button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--accent);min-height:38px}
details.raw{margin:6px 0 10px;font-size:13px}
details.raw summary{color:var(--accent);font-weight:700;padding:6px 0;cursor:pointer}
details.raw pre{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:260px;overflow:auto;font-size:12px}
.seg.wide{display:flex;margin:10px 0}.seg.wide button{flex:1;min-height:38px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.qc.bad{border-color:#F59E0B;box-shadow:0 0 0 1px #F59E0B}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qh b{font-size:15px}.qwarn{flex:1;min-width:0;color:#B45309;font-size:12.5px;font-weight:700}
.lk{border:none;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:6px 2px;min-height:36px}
.qh .lk{color:var(--danger)}
.qc textarea{display:block;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;font-size:16px;color:var(--ink);font-family:inherit;resize:none;overflow:hidden;line-height:1.4}
.qc textarea.exp{margin-top:6px;font-size:14px}
.ops{margin-top:8px}
.orow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.orow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;font-size:15.5px;color:var(--ink)}
.rad{width:38px;height:38px;border-radius:50%;flex:none;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted);padding:0}
.rad.on{background:var(--ok);border-color:var(--ok);color:#fff}
.x{width:34px;height:38px;border:none;background:none;color:var(--muted);font-size:20px;flex:none;padding:0}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.pubbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.pubbar .btn{width:100%;max-width:690px;min-height:52px;font-size:17px}
.qbar h1{text-align:center;font-size:16px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 10px;margin-right:6px}
.timer.low{background:var(--danger);color:#fff}
.qprog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:2px 0 14px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{padding-bottom:110px}
.qtext{font-size:18px;line-height:1.5;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 2px 16px}
.qo{display:flex;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;min-height:58px;font-size:16.5px;line-height:1.4;color:var(--ink)}
.qo .ol{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);font-weight:800;margin-right:12px;font-size:15px}
.qo .ot{flex:1;min-width:0;padding-top:4px;overflow-wrap:anywhere}
.qo.sel{border-color:var(--accent);background:var(--soft)}.qo.sel .ol{background:var(--accent);color:var(--accent-ink)}
.qo.right{border-color:var(--ok);background:#E7F7EE}.qo.right .ol{background:var(--ok);color:#fff}
.qo.wrong{border-color:var(--danger);background:#FDECEA}.qo.wrong .ol{background:var(--danger);color:#fff}
.qo.dim{opacity:.55}.qo:disabled{color:var(--ink)}
.fb{border-radius:14px;padding:12px 14px;margin-top:4px;font-size:15px}
.fb.ok{background:#E7F7EE;color:#14532D}.fb.no{background:#FDECEA;color:#7F1D1D}
.fb p{margin:6px 0 0}
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.qnav .btn{flex:1;max-width:340px;min-height:52px;font-size:16.5px}
.qnav .btn.sq{flex:0 0 auto;min-width:72px}
.pal{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin:-90px 0 110px}
.pal button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;color:var(--muted)}
.pal button.done{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.pal button.cur{outline:3px solid var(--accent)}
.pal .btn{width:100%;height:auto;margin-top:6px;color:var(--accent-ink);background:var(--accent);border:none}
.intro,.result{text-align:center;padding:4px 4px 30px}
.intro h2,.result h2{margin:12px 0 4px;font-size:22px;line-height:1.25}
.muted{color:var(--muted);font-size:14px;margin:4px 0}
.tile.big{width:64px;height:64px;border-radius:18px;font-size:16px;margin:8px auto 0}
.stats3{display:flex;gap:8px;margin:18px 0}
.stats3 div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.stats3 b{display:block;font-size:22px}.stats3 span{font-size:12.5px;color:var(--muted)}
.stats3 b.g{color:var(--ok)}.stats3 b.r{color:var(--danger)}
.modes{display:flex;gap:10px;margin-bottom:12px}
.modes button{flex:1;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;color:var(--ink)}
.modes button.on{border-color:var(--accent);background:var(--soft)}
.modes b{display:block;font-size:16px}.modes small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tog{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;margin:6px 0 4px;min-height:40px}
.tog input{width:20px;height:20px}
.btn.big{min-height:56px;font-size:18px}
.ring.big{width:160px;height:160px;margin:10px auto 0;position:relative}
.ring.big svg{width:100%;height:100%;-webkit-transform:rotate(-90deg);transform:rotate(-90deg)}
.ring.big circle{fill:none;stroke-width:12}.ring.big .bg{stroke:var(--line)}
.ring.big .fg{stroke-linecap:round}.ring.big .fg.good{stroke:var(--ok)}.ring.big .fg.mid{stroke:#F59E0B}.ring.big .fg.low{stroke:var(--danger)}
.ring.big span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring.big span b{font-size:32px}.ring.big span small{color:var(--muted);font-weight:700}
.rv{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:14px;padding:12px;margin:10px 0}
.rv.no{border-left-color:var(--danger)}
.rvh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.rv .qtext{font-size:16px;margin:0 0 8px}
.ro{display:flex;gap:8px;padding:6px 8px;border-radius:10px;font-size:15px;margin-bottom:4px}
.ro .ol{font-weight:800;color:var(--muted);flex:none;width:18px}
.ro.right{background:#E7F7EE}.ro.wrong{background:#FDECEA}
.ro em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.rexp{font-size:14px;margin:8px 0 0;color:var(--muted)}
.tgc{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:800;background:hsl(var(--th) 85% 90%);color:hsl(var(--th) 65% 26%);vertical-align:1px;white-space:nowrap}

function $(id){ return document.getElementById(id); }

function hasApp(){ return !!(window.Android && window.Android.http); }
function loadCfg(){ try { var o = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); S.api = BAKED_API || o.api || ''; S.pin = o.pin || ''; S.name = o.name || 'Academy'; S.sort = o.sort || 'name'; } catch(e){ S.api = BAKED_API; } }

function loadTree(){ try { var o = JSON.parse(localStorage.getItem(TREE_KEY) || 'null'); if (o && o.api === S.api && o.tree) setTree(o.tree, true); } catch(e){} }
var saveT = null;

/* ---------------- network ---------------- */
var reqN = 0, pend = {};
function net(method, url, body){
  return new Promise(function(res, rej){
    if (hasApp()){ var id = ++reqN; pend[id] = { res: res, rej: rej }; window.Android.http(id, method, url, body || ''); }
    else {
      var opt = method === 'POST' ? { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain;charset=utf-8' } } : {};
      fetch(url, opt).then(function(r){ return r.text(); }).then(res, function(){ rej(new Error('No internet connection')); });
    }
  });
}
window.__net = function(id, code, text){ var p = pend[id]; if (!p) return; delete pend[id]; if (code > 0) p.res(text); else p.rej(new Error(text || 'No internet connection')); };
function parse(t){
  var j; try { j = JSON.parse(t); } catch(e){ throw new Error('The academy link is not set up for public access.'); }
  if (!j.ok) throw new Error(j.error === 'Unknown request' ? 'Please update the Google script to the latest version (Academy-Code-v12).' : (j.error || 'Something went wrong'));

}

}
function apiPost(obj){ obj.pin = S.pin; return net('POST', S.api, JSON.stringify(obj)).then(parse); }

/* ---------------- tree ---------------- */
function setTree(t, fromCache){
  S.tree = t; S.name = t.name || S.name;
  var idx = { folder: {}, kids: {}, files: {}, counts: {} };
  t.folders.forEach(function(f){ idx.folder[f.id] = f; (idx.kids[f.parent] = idx.kids[f.parent] || []).push(f); });
  t.files.forEach(function(f){ (idx.files[f.parent] = idx.files[f.parent] || []).push(f); });
  function count(id, seen){
    if (idx.counts[id]) return idx.counts[id];
    var c = { notes: 0, lec: 0, ws: 0, newest: 0 };
    (idx.files[id] || []).forEach(function(f){ var k = kind(f); if (k === 'quiz') c.ws++; else if (k === 'video' || k === 'yt') c.lec++; else c.notes++; if (f.mod > c.newest) c.newest = f.mod; });
    if (seen < 30) (idx.kids[id] || []).forEach(function(k){ var s = count(k.id, seen + 1); c.notes += s.notes; c.lec += s.lec; c.ws += s.ws; if (s.newest > c.newest) c.newest = s.newest; });

  }
  count(t.rootId, 0);

  if (!S.stack.length || S.stack[0] !== t.rootId) S.stack = [t.rootId];

    S.syncing = false; refresh.retried = false; setTree(t); render();

    S.syncing = false;
    var temp = /Server error (404|408|429|5\d\d)|No internet|No answer/.test(e.message);

      if (fresh) toast('Couldn’t reach Google right now. Showing saved material.');

  });

function kind(f){
  if (/\.mcq\.json$/i.test(f.name || '')) return 'quiz';

  if (m === 'text/html' || /\.html?$/i.test(f.name || '')) return 'html';

function ytId(u){ var m = String(u || '').match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/); return m ? m[1] : ''; }
function fmtSize(n){ if (!n) return ''; if (n < 1048576) return Math.max(1, Math.round(n/1024)) + ' KB'; if (n < 1073741824) return (n/1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB'; return (n/1073741824).toFixed(1) + ' GB'; }
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(t){
  var d = new Date(t), now = new Date(), days = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);

/* ---------------- render ---------------- */

/* ---------------- tags ---------------- */
var PRESET_TAGS = ['Notes', 'Worksheet', 'Question paper'], TAGHUE = { 'notes': 215, 'worksheet': 150, 'question paper': 28 };
function tagHue(t){
  var h = TAGHUE[String(t).toLowerCase()];
  if (h == null){ h = 0; var l = String(t).toLowerCase(); for (var i = 0; i < l.length; i++) h = (h * 31 + l.charCodeAt(i)) % 360; }
  return h;
}
function tagChip(t){ return t ? '<span class="tgc" style="--th:' + tagHue(t) + '">' + esc(t) + '</span>' : ''; }
function tagCounts(){ var c = {}; if (S.tree) S.tree.files.forEach(function(f){ if (f.tag && !f.pending) c[f.tag] = (c[f.tag] || 0) + 1; }); return c; }
function normTag(t){
  t = String(t || '').replace(/[\u0000-\u001f#]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 24);
  if (!t) return '';
  var all = PRESET_TAGS.concat(Object.keys(tagCounts()));
  for (var i = 0; i < all.length; i++) if (all[i].toLowerCase() === t.toLowerCase()) return all[i];
  return t;
}
/* Asks which tag to use: tap Notes / Worksheet / Question paper / one of your earlier tags, or type a new one. */
function chooseTag(title, note, current, onPick, onCancel){

  var list = PRESET_TAGS.concat(custom), done = false;
  sheet('<h3>' + esc(title) + '</h3>' + (note ? '<p class="note" style="margin-top:0">' + esc(note) + '</p>' : '') +
    '<div class="tgrow">' + list.map(function(t, i){ return '<button class="tgb' + (t === current ? ' on' : '') + '" data-sh="t' + i + '" style="--th:' + tagHue(t) + '">' + esc(t) + '</button>'; }).join('') + '</div>' +
    '<label class="fl">Or create your own tag<input id="tagIn" maxlength="24" placeholder="e.g. Chapter test, Formula sheet, PYQ" autocomplete="off"></label>' +
    '<button class="btn wide" data-sh="own">Use this tag</button>' +
    '<button class="btn ghost wide" data-sh="none">No tag</button>',
  function(act){
    var tag = null;
    if (act === 'none') tag = '';
    else if (act === 'own'){ tag = normTag($('tagIn').value); if (!tag){ $('tagIn').focus(); toast('Type a tag name first.'); return; } }
    else if (/^t\d+$/.test(act)) tag = list[Number(act.slice(1))];
    if (tag == null) return;
    done = true; closeSheet(); onPick(tag);
  }, function(){ if (!done && onCancel) onCancel(); });
}
/* Saves a tag on several files (teacher). Shows at once; undoes itself if Google refuses. */
function applyTags(idsIn, tag, then){
  var files = idsIn.map(findFile).filter(function(f){ return f && !f.pending; });
  if (!files.length){ toast('Tags go on files — folders can’t be tagged.'); return; }
  var before = {}; files.forEach(function(f){ before[f.id] = f.tag; if (tag) f.tag = tag; else delete f.tag; });
  rebuild();
  toast(tag ? 'Tagged ' + files.length + ' item' + (files.length > 1 ? 's' : '') + ' “' + tag + '”.' : 'Tag removed from ' + files.length + ' item' + (files.length > 1 ? 's' : '') + '.');
  var chunks = [], list = files.map(function(f){ return f.id; });
  while (list.length) chunks.push(list.splice(0, 40));
  (function next(i){
    if (i >= chunks.length){ saveTree(); if (then) then(); return; }
    apiPost({ a: 'settag', ids: chunks[i], tag: tag }).then(function(){ next(i + 1); }, function(e){
      files.forEach(function(f){ if (chunks.slice(i).some(function(c){ return c.indexOf(f.id) >= 0; })){ if (before[f.id]) f.tag = before[f.id]; else delete f.tag; } });
      rebuild(); saveTree();
      toast(/Unknown request|update the Google script/i.test(e.message) ? 'Tags need the latest Google script (Academy-Code-v13).' : 'Couldn’t save the tag: ' + e.message);
    });
  })(0);
}

/* ---------------- viewer ---------------- */
var vfile = null;
function openFile(f){
  var k = kind(f);
  if (k === 'quiz'){ if (f.pending) return; if (QA.isQA(f)) QA.open(f); else MCQ.open(f); return; }
  PEOPLE.trackView(f);
  if (k === 'yt'){ openExternal(f.yt); return; }
  if (f.pending){ toast('Still uploading…'); return; }
  if (k === 'pdf'){ viewExternalFile(f); return; }
  vfile = f;
  $('vtitle').textContent = cleanName(f.name);
  $('vdl').style.display = (k === 'img' || k === 'file' || k === 'doc' || k === 'html') ? 'flex' : 'none';
  $('vpdf').style.display = 'none';
  var v = $('viewer');
  if (k === 'html' && READER.can() && window.fetch && window.DOMParser){
    v.classList.add('open'); $('vpdf').style.display = 'flex';
    READER.openHtml(f, function(){ $('vpdf').style.display = 'none'; if (vfile === f) driveView(f); });
    return;
  }
  driveView(f);
}
/* PDFs open in whichever app the student's own phone offers for PDFs, not inside Academy. */
var pendingExtView = null;
function viewExternalFile(f){
  if (!(window.Android && window.Android.viewExternal)){
    vfile = f; $('vtitle').textContent = cleanName(f.name); $('vdl').style.display = 'flex'; $('vpdf').style.display = 'none';
    driveView(f); return;

/* Saves a worksheet without ever hanging: shows the seconds, checks Drive itself if Google is slow to answer
   (the save often went through even when the answer gets lost on a weak connection), and gives up cleanly. */
function saveSafely(req, btn){
  var t0 = Date.now(), done = false, known = {}, oldMod = 0;
  (S.tree ? S.tree.files : []).forEach(function(x){ known[x.id] = 1; if (req.id && x.id === req.id) oldMod = x.mod || 0; });
  return new Promise(function(res, rej){
    function finish(j, e){ if (done) return; done = true; clearInterval(tick); if (j) res(j); else rej(e); }
    function look(){
      return apiGet({ a: 'tree', fresh: '1' }).then(function(t){
        var f = t.files.filter(function(x){
          if (req.id) return x.id === req.id && x.name === req.name && (x.mod || 0) > oldMod;
          return !known[x.id] && x.name === req.name && x.parent === req.parent;
        })[0];
        if (f){ if (!f.mcq) f.mcq = req.count; return { ok: true, item: f }; }
        return null;
      });
    }
    var checking = false;
    function check(){ if (checking || done) return; checking = true; look().then(function(j){ checking = false; if (j) finish(j); }, function(){ checking = false; }); }
    var tick = setInterval(function(){
      var s = Math.round((Date.now() - t0) / 1000);
      if (btn && btn.isConnected) btn.textContent = s < 8 ? 'Saving…' : s < 40 ? 'Saving… ' + s + ' s' : 'Checking Google Drive… ' + s + ' s';
      if (s === 40 || s === 75 || s === 110) check();
      if (s >= 150) finish(null, new Error('Google is not answering right now. Your worksheet is kept on this phone — check your internet and tap Publish again.'));
    }, 1000);
    apiPost(req).then(function(j){ finish(j); }, function(e){
      // the answer was lost — look whether the worksheet reached Drive anyway before reporting a problem
      if (done) return;
      look().then(function(j){ finish(j, e); }, function(){ finish(null, e); });
    });
  });
}

/* ---------------- uploads ---------------- */
var UP = [], tagWarned = false;
function startPick(){
  if (!(window.Android && window.Android.pickFiles)){ toast('Uploading works in the Android app.'); return; }
  window.Android.pickFiles();
}
window.__picked = function(list){
  var parent = curId();
  if (!list || !list.length) return;
  var names = list.length === 1 ? list[0].name : list.length + ' files';
  chooseTag('Tag ' + names + '?', 'Students can filter by tag. You can change it later from the ⋯ menu.', '', function(tag){
    startUploads(list, parent, tag);
  }, function(){ toast('Upload cancelled.'); });
};
function startUploads(list, parent, tag){
  list.forEach(function(f){
    var tmp = { id: 'tmp' + (++tmpN), name: f.name, mime: f.mime, size: f.size, mod: Date.now(), parent: parent, pending: true };
    if (tag) tmp.tag = tag;
    S.tree.files.push(tmp);
    UP.push({ tok: f.tok, name: f.name, size: f.size, mime: f.mime, parent: parent, sent: 0, state: 'wait', tmp: tmp.id, tag: tag || '' });
  });
  rebuild(); drawUps(); pump();
}
function pump(){
  if (UP.some(function(u){ return u.state === 'run' || u.state === 'prep'; })) return;
  var u = UP.filter(function(x){ return x.state === 'wait'; })[0];
  if (!u){ if (window.Android && window.Android.keepAwake) window.Android.keepAwake(false); return; }
  if (window.Android && window.Android.keepAwake) window.Android.keepAwake(true);
  u.state = 'prep'; drawUps();
  apiPost({ a: 'upload', parent: u.parent, name: u.name, mime: u.mime, size: u.size }).then(function(j){
    u.state = 'run'; drawUps(); window.Android.upload(u.tok, j.uploadUrl);
  }, function(e){ u.state = 'bad'; u.err = e.message; drawUps(); pump(); });
}
window.__upProgress = function(tok, sent, total){ if (UPDATER.ownsTok(tok)) return UPDATER.onUpProgress(tok, sent, total); if (BOARD.ownsTok(tok)) return BOARD.onUpProgress(tok, sent, total); var u = upOf(tok); if (!u) return; u.sent = sent; if (total > 0) u.size = total; drawUps(); };
window.__upDone = function(tok, ok, info){ if (UPDATER.ownsTok(tok)) return UPDATER.onUpDone(tok, ok, info); if (BOARD.ownsTok(tok)) return BOARD.onUpDone(tok, ok, info);
  var u = upOf(tok); if (!u) return;
  if (ok){
    u.state = 'ok'; u.sent = u.size;
    apiPost({ a: 'done', parent: u.parent, id: info || '', tag: u.tag || '', nowm: 1 }).then(function(j){
      if (j.item){
        if (u.tag && !j.item.tag){ j.item.tag = u.tag; if (!tagWarned){ tagWarned = true; toast('The tag stays on this phone only until you update the Google script (Academy-Code-v13).'); } }
        replaceLocal('files', u.tmp, j.item);
      } else { removeLocal(u.tmp); refresh(true); }
      saveTree();
    }, function(){ refresh(true); });
  } else { u.state = 'bad'; u.err = info; }
  drawUps(); pump();
  if (!UP.some(function(x){ return x.state === 'wait' || x.state === 'run' || x.state === 'prep'; })){
    var bad = UP.filter(function(x){ return x.state === 'bad'; }).length;
    toast(bad ? bad + ' upload' + (bad > 1 ? 's' : '') + ' failed. Tap Retry.' : 'All uploads finished.' + (tagWarned ? ' Update the Google script (v13) so tags are saved for everyone.' : ''));
  }
};
function upOf(tok){ for (var i = 0; i < UP.length; i++) if (UP[i].tok === tok) return UP[i]; return null; }
function drawUps(){
  var box = $('ups');
  if (!UP.length){ box.classList.remove('open'); return; }
  var active = UP.some(function(x){ return x.state !== 'ok' && x.state !== 'bad'; }), bad = UP.some(function(x){ return x.state === 'bad'; });
  box.classList.add('open');
  box.innerHTML = '<div class="uh"><span>' + (active ? 'Uploading… keep the app open' : 'Uploads') + '</span>' +
    (bad && !active ? '<button data-up="retry">Retry</button>' : '') + (!active ? '<button data-up="clear">Close</button>' : '') + '</div>' +
    UP.map(function(u){
      var pct = u.size ? Math.min(100, Math.round(u.sent * 100 / u.size)) : (u.state === 'ok' ? 100 : 0);
      var st = u.state === 'ok' ? 'Done' : u.state === 'bad' ? 'Failed' : u.state === 'wait' ? 'Waiting' : u.state === 'prep' ? 'Starting' : pct + '%';
      return '<div class="up ' + u.state + '"><div class="un"><span>' + esc(u.name) + '</span><span>' + st + '</span></div><div class="pb"><i style="width:' + pct + '%"></i></div>' +
        (u.state === 'bad' && u.err ? '<div style="color:var(--danger);font-size:12.5px;margin-top:3px">' + esc(u.err) + '</div>' : '') + '</div>';
    }).join('');
}
$('ups').addEventListener('click', function(e){
  var b = e.target.closest('[data-up]'); if (!b) return;
  if (b.dataset.up === 'clear'){
    UP.forEach(function(u){ if (u.state === 'bad') removeLocal(u.tmp); }); UP = []; drawUps(); rebuild();
  } else if (b.dataset.up === 'retry'){
    UP.forEach(function(u){ if (u.state === 'bad'){ u.state = 'wait'; u.sent = 0; u.err = ''; } }); UP = UP.filter(function(u){ return u.state !== 'ok'; }); drawUps(); pump();
  }
});

/* One step back. Used by the Android back button (and its gesture). */
var lastHomeBack = 0;
function backStep(){
  if ($('busyov')) return true;
  if ($('sheet')){ closeSheet(); return true; }
  if ($('viewer').classList.contains('open')){ closeViewer(); return true; }
  if (SEL.onBack()) return true;
  if (PEOPLE.onBack()) return true;
  if (QA.onBack()) return true;
  if (MCQ.onBack()) return true;
  if (S.mode === 'browse' && (S.tab === 'students' || S.tab === 'me' || S.tab === 'board')){ S.tab = 'material'; render(); window.scrollTo(0, 0); return true; }
  return goBack();
}
window.onBack = function(){
  try {
    if (backStep()) { lastHomeBack = 0; return true; }
  } catch (e) {
    // something went wrong: go to a safe screen instead of closing the app
    try { closeSheet(); S.mode = 'browse'; S.tab = 'material'; if (S.tree) S.stack = [S.tree.rootId]; render(); } catch (e2) {}
    return true;
  }
  if (Date.now() - lastHomeBack < 2000) return false;   // second press: let Android close the app
  lastHomeBack = Date.now(); toast('Press back again to exit');
  return true;
};
/* Tapping the tab you are already on goes one step back inside that tab. */
function tabBack(){
  if (SEL.onBack()) return true;
  if (S.tab === 'material'){ if (goBack()) return true; }
  else if (S.tab === 'students'){ if (PEOPLE.onBack()) return true; }
  window.scrollTo(0, 0);

}
